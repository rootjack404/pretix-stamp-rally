[project]
name = "pretix-stamp-rally"
dynamic = ["version"]
description = "Stamp rally for pretix events: booths scan attendee ticket QR codes instead of stamping on paper."
readme = "README.rst"
requires-python = ">=3.9"
license = {file = "LICENSE"}
keywords = ["pretix"]
authors = [
    {name = "ITSIP Travel", email = "support@itsiptravel.com"},
]
maintainers = [
    {name = "ITSIP Travel", email = "support@itsiptravel.com"},
]

dependencies = [
]

[project.entry-points."pretix.plugin"]
pretix_stamp_rally = "pretix_stamp_rally:PretixPluginMeta"

[project.entry-points."distutils.commands"]
build = "pretix_plugin_build.build:CustomBuild"

[build-system]
requires = [
    "setuptools",
    "pretix-plugin-build",
]

[project.urls]
homepage = "https://github.com/itsiptravel/pretix-stamp-rally"
repository = "https://github.com/itsiptravel/pretix-stamp-rally"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "pretix_stamp_rally.__version__"}

[tool.setuptools.packages.find]
include = ["pretix*"]
namespaces = false

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
combine_as_imports = true
default_section = "THIRDPARTY"
include_trailing_comma = true
known_third_party = "pretix"
known_standard_library = "typing"
skip = "setup.py"
use_parentheses = true
force_grid_wrap = 0
line_length = 120
known_first_party = "pretix_stamp_rally"
